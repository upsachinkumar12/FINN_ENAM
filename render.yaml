# Render blueprint for the FINN API. Create it from the Render dashboard ("New > Blueprint") after pushing the repo.
services:
  - type: web
    name: finn-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false            # optional; set in the dashboard to switch on AI features. Never committed
      # Any https://*.vercel.app origin is allowed by default (CORS_ORIGIN_REGEX); add other origins here
      - key: CORS_ORIGINS
        value: http://localhost:5173
      - key: MODEL_CHEAP
        value: claude-haiku-5-5
      - key: MODEL_STRONG
        value: claude-sonnet-5-5
      - key: AUTO_REFRESH_MINUTES
        value: "0"             # free instances sleep; refresh runs on demand from the app
      - key: VECTOR_SEARCH
        value: "false"         # the free 512 MB instance can't hold the embedding model; keyword search only
